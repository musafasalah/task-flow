openapi: 3.0.3
info:
  title: TaskFlow API
  description: >
    RESTful API for a Task Management System built with Laravel 13 and Sanctum.
    Users manage their own projects; each project contains tasks. A dashboard
    endpoint aggregates statistics.
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
    description: Local (php artisan serve / Docker) — change to match your host
  - url: https://task-flow.test/api
    description: Local (Laravel Herd/Valet)

tags:
  - name: Auth
  - name: Projects
  - name: Tasks
  - name: Dashboard

security:
  - bearerAuth: []

paths:
  /register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, example: Jane Doe }
                email: { type: string, format: email, example: jane@example.com }
                password: { type: string, format: password, example: password123 }
                password_confirmation: { type: string, format: password, example: password123 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /login:
    post:
      tags: [Auth]
      summary: Log in and receive a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: test@example.com }
                password: { type: string, format: password, example: password }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Logged out successfully. }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /user:
    get:
      tags: [Auth]
      summary: Get the authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Aggregated statistics for the authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total_projects: { type: integer, example: 3 }
                      active_projects: { type: integer, example: 2 }
                      total_tasks: { type: integer, example: 21 }
                      completed_tasks: { type: integer, example: 6 }
                      pending_tasks: { type: integer, example: 15 }
                      overdue_tasks: { type: integer, example: 4 }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /projects:
    get:
      tags: [Projects]
      summary: List the authenticated user's projects
      parameters:
        - { in: query, name: per_page, schema: { type: integer, default: 15 } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{project}:
    parameters:
      - { in: path, name: project, required: true, schema: { type: integer } }
    get:
      tags: [Projects]
      summary: Show a project
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResource' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Projects]
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResource' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Projects]
      summary: Soft-delete a project
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /projects/{project}/tasks:
    parameters:
      - { in: path, name: project, required: true, schema: { type: integer } }
    get:
      tags: [Tasks]
      summary: List tasks in a project (filter + search)
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [todo, in_progress, done] } }
        - { in: query, name: priority, schema: { type: string, enum: [low, medium, high] } }
        - { in: query, name: search, schema: { type: string }, description: Title substring }
        - { in: query, name: per_page, schema: { type: integer, default: 15 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Tasks]
      summary: Create a task in a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResource' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /projects/{project}/tasks/{task}:
    parameters:
      - { in: path, name: project, required: true, schema: { type: integer } }
      - { in: path, name: task, required: true, schema: { type: integer } }
    get:
      tags: [Tasks]
      summary: Show a task
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResource' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Tasks]
      summary: Update a task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskResource' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Tasks]
      summary: Soft-delete a task
      responses:
        '204': { description: No Content }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token

  schemas:
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Jane Doe }
        email: { type: string, example: jane@example.com }
        created_at: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string, example: "1|abcdef..." }
    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, example: Website Redesign }
        description: { type: string, nullable: true }
        status: { type: string, enum: [active, completed, archived], default: active }
    Project:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Website Redesign }
        description: { type: string, nullable: true }
        status: { type: string, enum: [active, completed, archived] }
        tasks_count: { type: integer, example: 7 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectResource:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Project' }
    ProjectCollection:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        links: { $ref: '#/components/schemas/PaginationLinks' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    TaskInput:
      type: object
      required: [title]
      properties:
        title: { type: string, example: Design homepage }
        description: { type: string, nullable: true }
        priority: { type: string, enum: [low, medium, high], default: medium }
        status: { type: string, enum: [todo, in_progress, done], default: todo }
        due_date: { type: string, format: date, nullable: true, example: "2026-12-31" }
    Task:
      type: object
      properties:
        id: { type: integer, example: 1 }
        project_id: { type: integer, example: 1 }
        title: { type: string, example: Design homepage }
        description: { type: string, nullable: true }
        priority: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [todo, in_progress, done] }
        due_date: { type: string, format: date, nullable: true }
        is_overdue: { type: boolean, example: false }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskResource:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Task' }
    TaskCollection:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        links: { $ref: '#/components/schemas/PaginationLinks' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    PaginationLinks:
      type: object
      properties:
        first: { type: string, nullable: true }
        last: { type: string, nullable: true }
        prev: { type: string, nullable: true }
        next: { type: string, nullable: true }
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: integer, nullable: true }
        last_page: { type: integer }
        per_page: { type: integer }
        to: { type: integer, nullable: true }
        total: { type: integer }

  responses:
    Unauthenticated:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: Unauthenticated. }
    Forbidden:
      description: Authenticated but not the owner
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: This action is unauthorized. }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: Resource not found. }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: The name field is required. }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
